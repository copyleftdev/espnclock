[package]
name = "espnclock"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
description = "Unofficial ESPN scoreboard CLI: pre/in/post game clock, NFL NBA MLB NHL UFC, local SSE"
license = "MIT"
repository = "https://github.com/copyleftdev/espnclock"
readme = "README.md"
keywords = ["espn", "sports", "scoreboard", "cli", "nfl"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
time = { version = "0.3", default-features = false, features = ["parsing"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
